      The Content-Security-Policy used to live here as a `<meta>` tag. Tauri
      injects the policy from `src-tauri/tauri.conf.json` instead, and when both
      are present the browser intersects them — the stricter `script-src 'self'`
      from the old `X-Content-Security-Policy` tag would have blocked nothing
      here but would have silently diverged from the real policy. One source.
    -->

  </head>

    <script type="module" src="/src/renderer/main.jsx"></script>
