name: Build Admin Pro

# Manual only. The build inlines the Supabase project URL and anon key into the
# installer, so it should be a deliberate act tied to a specific commit rather
# than something that fires on every push.
on:
  workflow_dispatch:

jobs:
  build-windows:
    # Windows only: the bundle target is NSIS and the offline credential cache
    # uses the Windows Credential Manager.
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Installs pnpm and Node, then runs `pnpm install --frozen-lockfile`
      # itself — `install` defaults to true, so there is no separate install
      # step. Keep these aligned with the local toolchain.
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true

      # This is a Tauri application: the backend is Rust and there is no
      # prebuilt native module to download.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # A cold build of the Rust dependency tree takes several minutes. Drop
      # this step if you would rather not keep a cache.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Builds the frontend and the release binary, produces the NSIS
      # installer, and attaches it to a release tagged v<version>. The version
      # comes from src-tauri/tauri.conf.json, which is what names the
      # installer; __VERSION__ is substituted in the tag, name and body.
      #
      # Reruns at the same version update the existing release rather than
      # creating a second one.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the installer builds cleanly and then cannot reach
          # Supabase at all. There is no runtime configuration file to correct
          # afterwards.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Admin Pro v__VERSION__
          releaseDraft: false
          prerelease: false
          # Retained independently of the release, so a deleted release still
          # leaves something to debug a failed install with.
          uploadWorkflowArtifacts: true
          # tauri.conf.json configures no updater, so there are no signed
          # updater bundles and latest.json would list no platforms. Set this
          # back to true — and add TAURI_SIGNING_PRIVATE_KEY and
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD to the env above — if the
          # updater plugin is ever enabled.
          uploadUpdaterJson: false
          releaseBody: |
            **Admin Pro __VERSION__** — Windows x64 installer (NSIS, per-user install, no
            elevation required).

            **Before installing**

            This build is bound to the Supabase project configured in the repository secrets,
            and that project's schema must already be applied — see
            [`docs/SUPABASE_SETUP.md`](https://github.com/carlodandan/admin-pro/blob/main/docs/SUPABASE_SETUP.md).

            The first launch requires an internet connection. Registration displays a
            **64-character recovery key exactly once** — save it before continuing. Without it,
            a lost administrator password means the encrypted employee columns cannot be
            recovered.

            **Requirements:** Windows 10/11 x64 and the WebView2 runtime (preinstalled on
            Windows 11 and on up-to-date Windows 10).
